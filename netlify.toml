[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_API_URL = "https://api.interviewspark.com"
  NEXT_PUBLIC_WS_URL = "wss://ws.interviewspark.com"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/image*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/api/*"
  to = "https://api.interviewspark.com/:splat"
  status = 200
  force = true
  headers = { X-Forwarded-Host = ":host", X-Forwarded-Proto = "https" }

[context.deploy-preview.environment]
  NEXT_PUBLIC_API_URL = "https://staging-api.interviewspark.com"
  NEXT_PUBLIC_WS_URL = "wss://staging-ws.interviewspark.com"

[context.branch-deploy.environment]
  NEXT_PUBLIC_API_URL = "https://staging-api.interviewspark.com"
  NEXT_PUBLIC_WS_URL = "wss://staging-ws.interviewspark.com"


